# DEV ONLY — local services for development
# Production uses Qdrant Cloud + Supabase hosted

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: gnosis
      POSTGRES_PASSWORD: gnosis_dev
      POSTGRES_DB: gnosis_chat

volumes:
  qdrant_data:
  postgres_data:
