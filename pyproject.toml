[project]
name = "gnosis-chat-backend"
version = "0.1.0"
description = "RAG-powered chat API for gnosis-chat"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "supabase>=2.11.0",
    "qdrant-client>=1.18.0",
    "langgraph",
    "langsmith>=0.2.0",
    "google-genai>=1.0.0",
    "stripe>=11.0.0",
    "python-multipart>=0.0.18",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
    "slowapi>=0.1.10",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
ingestion = [
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.13",
    "unstructured[pdf]>=0.21.5",
    "unstructured-inference>=1.2.0",
    "onnxruntime-gpu>=1.24.3; sys_platform == 'linux' or sys_platform == 'win32'",
    "onnxruntime>=1.24.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime<=1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba<0.63.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.46.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llama-index>=0.12.0",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-google-genai",
    "tqdm>=4.67.3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.30",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
