[project]
name = "gnosis-chat-backend"
version = "0.1.0"
description = "RAG-powered chat API for gnosis-chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "supabase>=2.11.0",
    "qdrant-client==1.13.0",
    "llama-index>=0.12.0",
    "llama-index-vector-stores-qdrant",
    "llama-index-embeddings-google-genai",
    "langgraph",
    "langsmith>=0.2.0",
    "google-genai>=1.0.0",
    "stripe>=11.0.0",
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.18",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
    "unstructured[pdf]>=0.21.5",
    "unstructured-inference>=1.2.0",
    "onnxruntime-gpu>=1.24.3",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
